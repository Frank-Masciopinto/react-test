name: CI

on:
  push:
    branches: [main, interview/django-angular-stack]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: userdir
          POSTGRES_USER: userdir
          POSTGRES_PASSWORD: userdir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U userdir -d userdir"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate
        env:
          POSTGRES_DB: userdir
          POSTGRES_USER: userdir
          POSTGRES_PASSWORD: userdir
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: python manage.py migrate --noinput

      - name: Django system check
        env:
          POSTGRES_DB: userdir
          POSTGRES_USER: userdir
          POSTGRES_PASSWORD: userdir
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: python manage.py check

      - name: Run tests
        env:
          POSTGRES_DB: userdir
          POSTGRES_USER: userdir
          POSTGRES_PASSWORD: userdir
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
